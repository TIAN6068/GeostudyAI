<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="GeoStudy AI，高校 GIS 专业课程 AI 学习平台，提供个人课程路线、AI 课程导师、Cesium 实验、课程成果评价与专业能力成长档案。"
    />
    <title>GeoStudy AI｜WebGIS 与三维可视化开发</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      .static{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.static .screen{grid-column:2}.static .screen>header{height:65px;border-bottom:1px solid var(--line);padding:0 29px;display:flex;align-items:center;justify-content:space-between}.simple-page{padding:55px 6%}.simple-page h1{font-size:34px}.simple-page>p{color:var(--muted)}.capgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:35px}.capgrid article{padding:25px;border:1px solid var(--line);border-radius:12px;background:#0d1937}.capgrid i{font-style:normal;color:var(--cyan);font-size:24px}.capgrid p{color:var(--muted);line-height:1.8}.back{color:var(--cyan)}@media(max-width:700px){.static{display:block}.static .screen{padding-bottom:60px}.capgrid{grid-template-columns:1fr}}
    </style>
    <link
      rel="stylesheet"
      href="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Widgets/widgets.css"
    />
    <script
      defer
      src="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Cesium.js"
    ></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="./config.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
